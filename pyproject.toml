[project]
name = "kiritharan-course06"
version = "0.1.0"
description = "Course work of week 6: MedicStore sales reporting."
readme = "README.md"
authors = [
    { name = "Kirishana Kiritharan", email = "kirishana.kiritharan@edu.em-lyon.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "ruff>=0.17.5",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
]

[project.scripts]
kiritharan-course06 = "kiritharan_course06:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
